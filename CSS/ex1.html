<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <style>
        h1 {
            color: red;
            background-color: lightblue;
        }
        p {
            color: purple;
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h3 style="color:white; background-color: black; text-align: center;">Inline/Internal/External styles</h3>
    <h1 style="color: black; background-color: rgb(255, 0, 119);">This is a heading with inline styles</h1>
    <p style="color: green; background-color: lightgray;">This is a paragraph with inline styles.</p>
    <h1>This is a heading with internal styles</h3>
    <p>This is a paragraph with internal styles.</p>
    <div>
        <h1>This is a heading with external styles</h3>
        <p>This is a paragraph with external styles.</p>
    </div>
</body>
</html>
