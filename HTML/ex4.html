    <body style="background-color:floralwhite;">

        <h2 style="color:brown; text-align: center;">HTML Tables , Forms & Multimedia</h2>
        <!-- Tables-->
        <h3>Student Tables</h3>
        <table name="studenttable">
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Age</th>
                <th>class</th>
                <th>Subject</th>
            </tr>

        <!--Forms-->

        <h3>Student Form </h3>
        <form action="studenttable.php" method="post">

            <label for="Name">Name:  </label>
            <input type="text" id="name" name="name"><br><br>

            <label for ="Age">Age:  </label>
            <input type="number" max="18" min="12"><br><br>

            <label for="class">Class:  </label>
            <select name="class" id="class">
                <option value="8">8th</option>
                <option value="9">9th</option>
                <option value="10">10th</option>
                <option value="11">11th</option>
                <option value="12">12th</option>
            </select><br><br>

            <label for="Subject">Subject:</label><br>

            <input type="radio" id="maths" name="subject" value="maths" max="1" min="0">
            <label for="Maths" id="maths" name="maths">Maths</label><br>

            <input type="radio" id="science" name="subject" value="science">
            <label for="Science" id="science" name="science">Science</label><br>

            <input type="radio" id="english" name="subject" value="english">
            <label for="English" id="english" name="english">English</label><br><br>

            <button type="submit">Add Student</button>
        </form>
