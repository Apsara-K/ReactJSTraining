<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Website</title>
    </head>
    <body style="background-color:azure">
        <h3 style="text-align: center;">HTML Attributes , Nested HTML</h3>

    <!-- Attributes-->

     <ol type="I">
    <li>
        <b>href & target</b><br>
        <a href="https://i.pinimg.com/474x/3c/f1/93/3cf1933f50752e8450e024cfbda4e1c0.jpg" target="_blank">Click here to see the image</a><br>
    </li><br>

    <li>
        <b>Src</b> & <b>Alt</b><br>
        <img src="https://t4.ftcdn.net/jpg/05/21/37/91/360_F_521379171_7WdKYCGBZCz731T7ZX3pGFIRS277Evke.jpg" alt="Hello!!"><br>
    </li><br>

    <li>
        <b>Width</b> & <b>Height</b><br>
        <img src="https://t4.ftcdn.net/jpg/05/21/37/91/360_F_521379171_7WdKYCGBZCz731T7ZX3pGFIRS277Evke.jpg" alt="Hello!!" width="200" height="200"><br>
    </li><br>

    <li>
        <b>Style</b>
        <p style="color:chocolate">This is the style paragraph</p>
    </li><br>

    <li>
        <b>Title</b>
        <p title="Hyper Text Markup Language">HTML was founded by Tim Berners-Lee in 1991.</p>
    </li><br>

    <!--Nested HTML-->
    <li>
        <p>
            <b>Nested HTML</b><br>
            <a href="https://www.w3schools.com/html/html_intro.asp"><i>Click here to learn HTML</i></a>
        </p>
    </li><br>

    <!-- Use of alt -->

    <li>
        <b>Use of alt</b><br>
        <img src="https://i.pinimg.com/564x/e1/e4/f8/515c.jpg" alt="Bye!!">
    </li><br>

     </ol>
    </body>
</html>
